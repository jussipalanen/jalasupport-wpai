<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <title>JalaSupport AI</title>
    <!--
        Home-screen icon source (iOS apple-touch-icon, Android maskable icon):
        square and opaque, because devices apply their own rounded/circular
        mask and iOS fills transparent areas with black. The letters stay
        inside the central safe zone (radius 40%) used by maskable icons.
    -->
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6d28d9" />
            <stop offset="1" stop-color="#2e1065" />
        </linearGradient>
    </defs>
    <rect x="-4" y="-4" width="72" height="72" fill="url(#bg)" shape-rendering="crispEdges" />
