# Dependabot version updates: weekly, minor and patch updates grouped into one
# pull request per ecosystem, major versions as separate pull requests.
#
# Docker images are not listed: the Dockerfile and docker-compose.yml take
# their versions from variables (PHP_VERSION, MYSQL_VERSION, ...), which
# Dependabot cannot resolve. Update those deliberately.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web/app/themes/jalasupport
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      theme-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      tooling:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
