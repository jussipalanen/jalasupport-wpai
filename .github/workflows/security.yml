name: Security

# Dependency vulnerability audits and secret scanning. Also runs weekly so
# newly published advisories are caught without code changes.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit (Composer, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: composer audit (lock file)
        run: composer audit --locked --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: npm audit (repository tooling)
        run: npm audit --audit-level=moderate

      - name: npm audit (theme)
        working-directory: web/app/themes/jalasupport
        run: npm audit --audit-level=moderate

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --exit-code 1
