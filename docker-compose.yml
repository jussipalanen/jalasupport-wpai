name: jalasupport

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
        COMPOSER_VERSION: ${COMPOSER_VERSION:-2.11.2}
        WP_CLI_VERSION: ${WP_CLI_VERSION:-2.12.0}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Web GUI for MySQL (local development only). Signs in automatically as the
  # application database user; reachable only from this machine (127.0.0.1).
  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VERSION:-5.2}
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
