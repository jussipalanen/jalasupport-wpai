; PHP settings shared by all environments.
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
expose_php = Off
; Hide deprecations raised before WordPress loads (e.g. inside the WP-CLI phar).
; WordPress re-enables full reporting itself when WP_DEBUG is on.
error_reporting = E_ALL & ~E_DEPRECATED

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Development reads changes immediately; the production image overrides this.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
