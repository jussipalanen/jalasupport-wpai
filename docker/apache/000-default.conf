<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/web

    <Directory /var/www/html/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # WordPress front controller (Bedrock web root).
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Vite build output: file names carry a content hash, so a changed file
    # gets a new URL and browsers may keep these for a year.
    <Directory /var/www/html/web/app/themes/jalasupport/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # Transfer folder for ./dev azure import-tickets (customer data on the
    # uploads share during an import): never served over HTTP.
    <Directory /var/www/html/web/app/uploads/jalasupport-import>
        Require all denied
    </Directory>

    # Never serve dotfiles (e.g. .env if misplaced) or Composer metadata.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Pass the Authorization header through to PHP (REST API application passwords).
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
